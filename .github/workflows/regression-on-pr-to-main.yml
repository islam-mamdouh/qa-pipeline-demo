name: Regression + Smoke Tests - PR to Main

on:
  pull_request:
    branches:
      - main

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-pipeline-demo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Run Regression Tests
        run: mvn test -Dsuite=src/test/resources/regression-suite.xml

      - name: Upload Regression Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-report
          path: qa-pipeline-demo/target/surefire-reports/

  smoke-tests:
    runs-on: ubuntu-latest
    needs: regression-tests
    defaults:
      run:
        working-directory: qa-pipeline-demo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Run Smoke Tests Again
        run: mvn test -Dsuite=src/test/resources/smoke-suite.xml

      - name: Upload Smoke Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report-final
          path: qa-pipeline-demo/target/surefire-reports/